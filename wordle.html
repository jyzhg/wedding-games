<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle – Mini Games</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    .clue-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .clue-box strong { color: var(--text); }

    .board {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      margin-bottom: 1rem;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .tile {
      width: 58px;
      height: 58px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
      transition: border-color 0.1s;
      position: relative;
    }

    .tile.filled { border-color: #888; }

    .tile.correct { background: var(--sage-deep, #4a7c59); border-color: var(--sage-deep, #4a7c59); color: #fff; }
    .tile.present { background: var(--gold-warm, #c8a05a); border-color: var(--gold-warm, #c8a05a); color: #fff; }
    .tile.absent  { background: #5a6e5a; border-color: #5a6e5a; color: #fff; }

    .tile.flip {
      animation: flipIn 0.25s ease forwards;
    }

    @keyframes flipIn {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(-90deg); }
      100% { transform: rotateX(0deg); }
    }

    .tile.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    @media (max-width: 480px) {
      .tile { width: 50px; height: 50px; font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="logo">✦ Millwick Games</a>
    <ul class="nav-links">
      <li><a href="find-your-seat.html">Find Seat</a></li>
      <li><a href="wordle.html" class="active">Wordle</a></li>
      <li><a href="connections.html">Connections</a></li>
      <li><a href="crossword.html">Crossword</a></li>
    </ul>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <div class="page-wrapper">
    <h1 class="page-title">Wordle</h1>
    <p class="page-subtitle">6 tries to guess the 5-letter word</p>

    <div class="clue-box" id="clueBox">
      <strong>Clue:</strong> <span id="clueText">Loading…</span>
    </div>

    <div class="board" id="board"></div>

    <div class="result-banner" id="resultBanner"></div>

    <div class="keyboard" id="keyboard">
      <div class="keyboard-row" id="row0"></div>
      <div class="keyboard-row" id="row1"></div>
      <div class="keyboard-row" id="row2"></div>
    </div>
  </div>

  <script src="puzzles.js"></script>
  <script>
    const TARGET = PUZZLES.wordle.word.toUpperCase();
    const CLUE   = PUZZLES.wordle.clue;
    const ROWS   = 6, COLS = 5;

    document.getElementById("clueText").textContent = CLUE;

    // Build board
    const board = document.getElementById("board");
    const tiles = [];
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement("div");
      row.className = "row";
      tiles[r] = [];
      for (let c = 0; c < COLS; c++) {
        const t = document.createElement("div");
        t.className = "tile";
        row.appendChild(t);
        tiles[r][c] = t;
      }
      board.appendChild(row);
    }

    // Build keyboard
    const KEYS = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["ENTER","Z","X","C","V","B","N","M","⌫"]
    ];
    const keyEls = {};
    KEYS.forEach((row, ri) => {
      const rowEl = document.getElementById("row" + ri);
      row.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key" + (k.length > 1 ? " wide" : "");
        btn.textContent = k;
        btn.addEventListener("click", () => handleKey(k));
        rowEl.appendChild(btn);
        keyEls[k] = btn;
      });
    });

    let currentRow = 0, currentCol = 0, guess = [], gameOver = false;
    const letterStates = {};

    document.addEventListener("keydown", e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Enter") handleKey("ENTER");
      else if (e.key === "Backspace") handleKey("⌫");
      else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
    });

    function handleKey(k) {
      if (gameOver) return;
      if (k === "ENTER") {
        submit();
      } else if (k === "⌫") {
        if (currentCol > 0) {
          currentCol--;
          guess.pop();
          tiles[currentRow][currentCol].textContent = "";
          tiles[currentRow][currentCol].classList.remove("filled");
        }
      } else if (currentCol < COLS) {
        guess.push(k);
        tiles[currentRow][currentCol].textContent = k;
        tiles[currentRow][currentCol].classList.add("filled");
        currentCol++;
      }
    }

    function submit() {
      if (currentCol < COLS) { shake(currentRow); toast("Not enough letters"); return; }
      const word = guess.join("");
      const result = evaluate(word, TARGET);
      reveal(currentRow, result, word);
    }

    function evaluate(word, target) {
      const res = Array(COLS).fill("absent");
      const targetArr = target.split("");
      const wordArr   = word.split("");
      const used      = Array(COLS).fill(false);

      // Correct pass
      wordArr.forEach((l, i) => {
        if (l === targetArr[i]) { res[i] = "correct"; used[i] = true; }
      });
      // Present pass
      wordArr.forEach((l, i) => {
        if (res[i] === "correct") return;
        const idx = targetArr.findIndex((t, j) => t === l && !used[j] && res[j] !== "correct");
        if (idx !== -1) { res[i] = "present"; used[idx] = true; }
      });
      return res;
    }

    function reveal(row, result, word) {
      const rowTiles = tiles[row];
      result.forEach((state, i) => {
        setTimeout(() => {
          rowTiles[i].classList.add("flip");
          setTimeout(() => {
            rowTiles[i].classList.add(state);
            rowTiles[i].classList.remove("flip");
          }, 125);
          // Update key color
          const letter = word[i];
          const current = letterStates[letter];
          const priority = { correct: 3, present: 2, absent: 1 };
          if (!current || priority[state] > priority[current]) {
            letterStates[letter] = state;
            keyEls[letter].className = "key " + state;
          }
        }, i * 80);
      });

      setTimeout(() => {
        const won = result.every(r => r === "correct");
        currentRow++;
        currentCol = 0;
        guess = [];
        if (won) {
          gameOver = true;
          const msgs = ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"];
          toast(msgs[Math.min(currentRow - 1, 5)]);
          showResult("win", "You got it! 🎉 The word was " + TARGET + ".");
        } else if (currentRow >= ROWS) {
          gameOver = true;
          showResult("lose", "The word was " + TARGET + ". Better luck next time!");
        }
      }, COLS * 80 + 300);
    }

    function shake(row) {
      tiles[row].forEach(t => {
        t.classList.remove("shake");
        void t.offsetWidth;
        t.classList.add("shake");
      });
    }

    function toast(msg) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      document.getElementById("toastContainer").appendChild(el);
      setTimeout(() => el.remove(), 2100);
    }

    function showResult(type, msg) {
      const b = document.getElementById("resultBanner");
      b.textContent = msg;
      b.className = "result-banner show " + type;
    }
  </script>
</body>
</html>
